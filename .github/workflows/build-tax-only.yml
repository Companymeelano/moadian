name: Build Tax APK Only

on:
  push:
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tax-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tax:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo contents
        run: |
          echo "=== Top-level ==="
          ls -la
          echo ""
          echo "=== extracted/ ==="
          ls -la extracted/ 2>&1 || echo "no extracted/"
          echo ""
          echo "=== extracted/MEELANO-Android/ ==="
          ls -la extracted/MEELANO-Android/ 2>&1 || echo "no extracted/MEELANO-Android/"
          echo ""
          echo "=== extracted/MEELANO-Android/app/ ==="
          ls -la extracted/MEELANO-Android/app/ 2>&1 || echo "no app/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Get version info
        id: version
        run: |
          echo "=== build.gradle ==="
          cat extracted/MEELANO-Android/app/build.gradle
          echo ""
          echo "=== extracted values ==="
          VERSION=$(grep "versionName" extracted/MEELANO-Android/app/build.gradle | head -1 | sed "s/.*versionName[ '\"]*//;s/['\" ].*//")
          CODE=$(grep "versionCode" extracted/MEELANO-Android/app/build.gradle | head -1 | sed "s/[^0-9]//g")
          echo "VERSION=$VERSION"
          echo "CODE=$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::Could not extract version info!"
            exit 1
          fi

      - name: Build Tax Debug APK
        working-directory: extracted/MEELANO-Android
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :app:assembleTaxDebug 2>&1 | tail -50

      - name: Build Tax Release APK (signed with install key)
        working-directory: extracted/MEELANO-Android
        run: |
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :app:assembleTaxRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/signing/meelano-install.p12" \
            -Pandroid.injected.signing.store.password="derakhshan-install" \
            -Pandroid.injected.signing.key.alias="meelano" \
            -Pandroid.injected.signing.key.password="derakhshan-install" \
            2>&1 | tail -50

      - name: Collect APKs
        run: |
          mkdir -p out
          VERSION=$(grep -oP "versionName\s+'\K[0-9.]+" extracted/MEELANO-Android/app/build.gradle)
          cp extracted/MEELANO-Android/app/build/outputs/apk/tax/release/*.apk "out/MEELANO-Tax-v$VERSION-release.apk"
          cp extracted/MEELANO-Android/app/build/outputs/apk/tax/debug/*.apk "out/MEELANO-Tax-v$VERSION-debug.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MEELANO-Tax-APK
          path: out/*.apk
          retention-days: 14

      - name: Commit APK to branch
        if: github.event_name == 'push'
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[0-9.]+" extracted/MEELANO-Android/app/build.gradle)
          CODE=$(grep -oP "versionCode\s+\K[0-9]+" extracted/MEELANO-Android/app/build.gradle)
          mkdir -p apk
          cp out/MEELANO-Tax-v$VERSION-release.apk apk/
          cp out/MEELANO-Tax-v$VERSION-debug.apk apk/
          printf '{"versionCode": %s, "versionName": "%s", "url": "https://github.com/%s/raw/%s/apk/MEELANO-Tax-v%s-release.apk"}\n' \
            "$CODE" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$VERSION" > apk/latest-tax.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apk/MEELANO-Tax-v$VERSION-release.apk apk/MEELANO-Tax-v$VERSION-debug.apk apk/latest-tax.json
          git commit -m "Build Tax APK v$VERSION [skip ci]" || echo "No changes"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 5
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tax-v${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          name: MEELANO Tax v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}