name: Build Tax APK Only

on:
  push:
    branches: ['arena/**', 'main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tax-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tax:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Tax APK (debug + release)
        working-directory: extracted/MEELANO-Android
        run: |
          set +e
          echo "=== Building Debug ==="
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :app:assembleTaxDebug 2>&1 | tail -30
          echo "exit_debug=${PIPESTATUS[0]}"
          echo ""
          echo "=== Building Release ==="
          gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :app:assembleTaxRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/signing/meelano-install.p12" \
            -Pandroid.injected.signing.store.password="derakhshan-install" \
            -Pandroid.injected.signing.key.alias="meelano" \
            -Pandroid.injected.signing.key.password="derakhshan-install" \
            2>&1 | tail -30
          echo "exit_release=${PIPESTATUS[0]}"
          echo ""
          echo "=== Final APKs ==="
          find app/build/outputs/apk -name "*.apk" -ls
          exit 0

      - name: Copy APKs to a known location
        run: |
          set +e
          mkdir -p /tmp/tax-apks
          cp extracted/MEELANO-Android/app/build/outputs/apk/tax/release/*.apk /tmp/tax-apks/MEELANO-Tax-v6.0.1-release.apk 2>&1
          cp extracted/MEELANO-Android/app/build/outputs/apk/tax/debug/*.apk /tmp/tax-apks/MEELANO-Tax-v6.0.1-debug.apk 2>&1
          ls -la /tmp/tax-apks
          exit 0

      - name: Upload APKs as artifact (1)
        uses: actions/upload-artifact@v4
        with:
          name: MEELANO-Tax-v6.0.1-release
          path: /tmp/tax-apks/MEELANO-Tax-v6.0.1-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APKs as artifact (2)
        uses: actions/upload-artifact@v4
        with:
          name: MEELANO-Tax-v6.0.1-debug
          path: /tmp/tax-apks/MEELANO-Tax-v6.0.1-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Commit APKs to branch
        if: github.event_name == 'push'
        run: |
          set +e
          mkdir -p apk
          cp /tmp/tax-apks/MEELANO-Tax-v6.0.1-release.apk apk/ 2>&1
          cp /tmp/tax-apks/MEELANO-Tax-v6.0.1-debug.apk apk/ 2>&1
          printf '{"versionCode": 108, "versionName": "6.0.1", "url": "https://github.com/%s/raw/%s/apk/MEELANO-Tax-v6.0.1-release.apk"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > apk/latest-tax.json
          ls -la apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add apk/MEELANO-Tax-v6.0.1-release.apk apk/MEELANO-Tax-v6.0.1-debug.apk apk/latest-tax.json
          git commit -m "Build Tax APK v6.0.1 [skip ci]" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 5
          done
          exit 0

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tax-v6.0.1-build-${{ github.run_number }}
          name: MEELANO Tax v6.0.1 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            /tmp/tax-apks/MEELANO-Tax-v6.0.1-release.apk
            /tmp/tax-apks/MEELANO-Tax-v6.0.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}